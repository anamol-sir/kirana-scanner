<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Kirana Barcode Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.0/dist/iife/reader/index.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin: 10px 0;
    }

    #camera {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      display: block;
    }

    #status {
      background: white;
      padding: 15px;
      margin: 15px auto;
      border-radius: 10px;
      max-width: 500px;
      font-size: 18px;
    }

    #result {
      background: white;
      padding: 20px;
      margin: 15px auto;
      border-radius: 10px;
      max-width: 500px;
      font-size: 24px;
      font-weight: bold;
      word-break: break-all;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
      margin: 8px;
    }
  </style>
</head>

<body>

<h1>📦 Kirana Scanner</h1>

<div id="status">
  Starting camera...
</div>

<div id="camera">
  <video id="video" autoplay playsinline muted></video>
</div>

<div id="result">
  Point camera at a product barcode
</div>

<script>

const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");

let scanning = true;
let lastBarcode = "";
let lastScanTime = 0;

async function startCamera() {

  try {

    statusBox.innerText = "Requesting camera...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        },
        width: {
          ideal: 1280
        },
        height: {
          ideal: 720
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    statusBox.innerText =
      "📷 Camera ready — point at a product barcode";

    scanLoop();

  } catch (error) {

    console.error(error);

    statusBox.innerText =
      "❌ Camera error: " + error.message;

  }
}


async function scanLoop() {

  if (!scanning) return;

  try {

    if (video.readyState >= 2) {

      const canvas = document.createElement("canvas");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      canvas.toBlob(async function(blob) {

        if (!blob) return;

        try {

          const results =
            await ZXingWASM.readBarcodes(
              blob,
              {
                formats: [
                  "EAN13",
                  "EAN8",
                  "UPCA",
                  "UPCE",
                  "Code128",
                  "Code39",
                  "ITF"
                ],
                tryHarder: true,
                maxNumberOfSymbols: 1
              }
            );

          if (results.length > 0) {

            const barcode =
              results[0].text;

            const now = Date.now();

            if (
              barcode !== lastBarcode ||
              now - lastScanTime > 2000
            ) {

              lastBarcode = barcode;
              lastScanTime = now;

              resultBox.innerText =
                "✅ " + barcode;

              statusBox.innerText =
                "Barcode detected";

              // Beep
              try {
                const audio =
                  new Audio(
                    "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA="
                  );

                audio.play();
              } catch (e) {}

            }

          }

        } catch (error) {

          console.log(
            "Decoder:",
            error
          );

        }

      }, "image/jpeg", 0.9);

    }

  } catch (error) {

    console.log(error);

  }

  setTimeout(
    scanLoop,
    150
  );
}


startCamera();

</script>

</body>
</html>
