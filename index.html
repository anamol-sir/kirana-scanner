<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Kirana Scanner</title>

  <!-- ZBar WebAssembly barcode engine -->
  <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/index.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 18px 15px 10px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    #status {
      margin-top: 8px;
      color: #aaa;
      font-size: 15px;
    }

    #scanner-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 15px auto 0;
      background: #000;
      overflow: hidden;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
      object-fit: cover;
      background: #000;
    }

    /*
      Barcode aiming box
    */
    #scan-box {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 35%;
      height: 30%;

      border: 3px solid #00ff66;
      border-radius: 12px;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.25);

      pointer-events: none;
    }

    #scan-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }

    #result {
      margin: 18px 15px 8px;
      padding: 18px;
      border-radius: 12px;
      background: #222;
      font-size: 24px;
      font-weight: bold;
      word-break: break-all;
    }

    #result-label {
      color: #999;
      font-size: 13px;
      font-weight: normal;
      margin-bottom: 6px;
    }

    #buttons {
      padding: 10px 15px 30px;
    }

    button {
      width: 100%;
      max-width: 500px;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      margin: 6px 0;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #333;
    }

    #startBtn {
      background: #1976d2;
    }

    #stopBtn {
      background: #555;
    }

    #lastScans {
      max-width: 600px;
      margin: 10px auto;
      padding: 0 15px 30px;
      text-align: left;
    }

    #lastScans h2 {
      font-size: 17px;
      color: #aaa;
    }

    .scan-item {
      background: #222;
      border-radius: 8px;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
    }

    .success {
      color: #00ff66;
    }

    .error {
      color: #ff6666;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>📦 Kirana Scanner</h1>
    <div id="status">Preparing scanner...</div>
  </header>

  <div id="scanner-container">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <div id="scan-box">
      <div id="scan-line"></div>
    </div>

  </div>

  <div id="result">
    <div id="result-label">LAST BARCODE</div>
    <div id="barcodeValue">Waiting...</div>
  </div>

  <div id="buttons">

    <button id="startBtn" onclick="startScanner()">
      📷 START SCANNER
    </button>

    <button id="stopBtn" onclick="stopScanner()">
      ⏹ STOP SCANNER
    </button>

  </div>

  <div id="lastScans">

    <h2>Recent scans</h2>

    <div id="scanList"></div>

  </div>

  <canvas id="canvas"></canvas>


<script>

/* =========================================================
   KIRANA BARCODE SCANNER
   Camera → Canvas → ZBar WASM
   ========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

const statusEl = document.getElementById("status");
const barcodeValue = document.getElementById("barcodeValue");
const scanList = document.getElementById("scanList");

let stream = null;
let scanning = false;
let processing = false;

let lastBarcode = "";
let lastScanTime = 0;

const DUPLICATE_DELAY = 1500;


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type = "") {

  statusEl.textContent = message;

  statusEl.className = type;

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startScanner() {

  if (scanning) {
    return;
  }

  try {

    setStatus("Requesting camera permission...");

    /*
      Rear iPhone camera.
    */

    stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        },

        frameRate: {
          ideal: 30,
          max: 30
        }
      },

      audio: false

    });

    video.srcObject = stream;

    await video.play();

    scanning = true;

    setStatus(
      "Camera ready — point at a product barcode",
      "success"
    );

    requestAnimationFrame(scanFrame);

  } catch (error) {

    console.error(error);

    setStatus(
      "Camera error: " + error.message,
      "error"
    );

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopScanner() {

  scanning = false;

  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;

  }

  video.srcObject = null;

  setStatus("Scanner stopped");

}


/* =========================================================
   SCAN CAMERA FRAME
   ========================================================= */

async function scanFrame() {

  if (!scanning) {
    return;
  }

  /*
    Do not process another frame while ZBar is busy.
  */

  if (!processing && video.readyState >= 2) {

    processing = true;

    try {

      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      if (videoWidth && videoHeight) {

        /*
          Scan mainly the center region.

          This reduces the amount of image ZBar
          has to process and makes continuous scanning
          faster on iPhone.
        */

        const cropWidth = Math.floor(videoWidth * 0.85);
        const cropHeight = Math.floor(videoHeight * 0.40);

        const cropX =
          Math.floor((videoWidth - cropWidth) / 2);

        const cropY =
          Math.floor((videoHeight - cropHeight) / 2);

        /*
          Resize the scan image.

          900px is more than enough for most
          retail barcodes while keeping processing fast.
        */

        const scale =
          Math.min(1, 900 / cropWidth);

        const outputWidth =
          Math.floor(cropWidth * scale);

        const outputHeight =
          Math.floor(cropHeight * scale);

        canvas.width = outputWidth;
        canvas.height = outputHeight;

        ctx.drawImage(
          video,

          cropX,
          cropY,
          cropWidth,
          cropHeight,

          0,
          0,
          outputWidth,
          outputHeight
        );

        const imageData =
          ctx.getImageData(
            0,
            0,
            outputWidth,
            outputHeight
          );

        /*
          Send image to ZBar WASM.
        */

        const symbols =
          await zbarWasm.scanImageData(imageData);

        if (symbols && symbols.length > 0) {

          for (const symbol of symbols) {

            let decoded = "";

            try {
              decoded = symbol.decode();
            } catch (e) {
              continue;
            }

            if (!decoded) {
              continue;
            }

            handleBarcode(
              decoded,
              symbol.typeName
            );

            /*
              We only need the first valid barcode
              from this frame.
            */

            break;
          }

        }

      }

    } catch (error) {

      console.error(
        "Barcode processing error:",
        error
      );

    }

    processing = false;

  }

  /*
    Keep scanning continuously.
  */

  requestAnimationFrame(scanFrame);

}


/* =========================================================
   BARCODE DETECTED
   ========================================================= */

function handleBarcode(
  barcode,
  barcodeType
) {

  const now = Date.now();

  /*
    Prevent the same barcode from being detected
    20 times while it is still in front of camera.
  */

  if (
    barcode === lastBarcode &&
    now - lastScanTime < DUPLICATE_DELAY
  ) {

    return;

  }

  lastBarcode = barcode;
  lastScanTime = now;

  /*
    Display result.
  */

  barcodeValue.textContent = barcode;

  setStatus(
    "✅ " + barcodeType + " detected",
    "success"
  );

  /*
    Add to recent scans.
  */

  addRecentScan(
    barcode,
    barcodeType
  );

  /*
    iPhone vibration where supported.
  */

  if (navigator.vibrate) {

    try {
      navigator.vibrate(80);
    } catch (e) {}

  }

  /*
    Beep.
  */

  beep();

}


/* =========================================================
   RECENT SCANS
   ========================================================= */

function addRecentScan(
  barcode,
  type
) {

  const item =
    document.createElement("div");

  item.className = "scan-item";

  item.innerHTML =
    "<strong>" +
    barcode +
    "</strong><br>" +
    "<small>" +
    type +
    " • " +
    new Date().toLocaleTimeString() +
    "</small>";

  scanList.prepend(item);

  /*
    Keep only last 10 scans on screen.
  */

  while (
    scanList.children.length > 10
  ) {

    scanList.removeChild(
      scanList.lastChild
    );

  }

}


/* =========================================================
   BEEP
   ========================================================= */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.frequency.value = 1200;

    oscillator.type = "sine";

    gain.gain.value = 0.08;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.08
    );

  } catch (e) {}

}


/* =========================================================
   PAGE VISIBILITY
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.hidden &&
      scanning
    ) {

      stopScanner();

    }

  }
);


/* =========================================================
   INITIAL STATUS
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      setStatus(
        "This browser cannot access the camera.",
        "error"
      );

      return;

    }

    setStatus(
      "Tap START SCANNER"
    );

  }
);

</script>

</body>
</html>
