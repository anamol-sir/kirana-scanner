<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirana Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
      padding: 15px;
      background: white;
      border-radius: 10px;
      margin: 15px auto;
      max-width: 500px;
      word-break: break-all;
    }

    #status {
      margin: 10px;
      color: #555;
    }
  </style>
</head>

<body>

<h1>📦 Kirana Scanner</h1>

<div id="status">
  Camera scanner loading...
</div>

<div id="reader"></div>

<div id="result">
  Scan a barcode
</div>

<script>

let lastBarcode = "";
let lastScanTime = 0;

function onScanSuccess(decodedText) {

  const now = Date.now();

  // Prevent the same barcode from firing repeatedly
  // while the camera is still looking at it.
  if (decodedText === lastBarcode && now - lastScanTime < 2000) {
    return;
  }

  lastBarcode = decodedText;
  lastScanTime = now;

  document.getElementById("result").innerText =
    "Barcode: " + decodedText;

  document.getElementById("status").innerText =
    "✅ Barcode detected";

  // Beep
  try {
    const audio = new Audio(
      "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA="
    );
    audio.play();
  } catch (e) {
  }
}

function onScanFailure(error) {
  // Ignore normal scanning failures.
}

const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,
    qrbox: {
      width: 280,
      height: 150
    }
  },
  false
);

scanner.render(onScanSuccess, onScanFailure);

</script>

</body>
</html>
