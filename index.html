<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kirana Scanner</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }

    header { padding: 18px 15px 10px; }
    h1 { margin: 0; font-size: 25px; }

    #status {
      margin-top: 8px;
      color: #aaa;
      font-size: 15px;
    }

    #scanner-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 430px;
      margin: 15px auto 0;
      background: #000;
      overflow: hidden;
      border-radius: 12px;
    }

    #result {
      margin: 18px 15px 8px;
      padding: 18px;
      border-radius: 12px;
      background: #222;
      font-size: 24px;
      font-weight: bold;
      word-break: break-all;
    }

    #result-label {
      color: #999;
      font-size: 13px;
      font-weight: normal;
      margin-bottom: 6px;
    }

    #buttons { padding: 10px 15px 30px; }

    button {
      width: 100%;
      max-width: 500px;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      margin: 6px 0;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #333;
    }

    #startBtn { background: #1976d2; }
    #stopBtn { background: #555; }

    #lastScans {
      max-width: 600px;
      margin: 10px auto;
      padding: 0 15px 30px;
      text-align: left;
    }

    #lastScans h2 {
      font-size: 17px;
      color: #aaa;
    }

    .scan-item {
      background: #222;
      border-radius: 8px;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
    }

    .success { color: #00ff66 !important; }
    .error { color: #ff6666 !important; }

    /* Make the library's scanner fill our box */
    #scanner-container > * {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>
  <header>
    <h1>📦 Kirana Scanner</h1>
    <div id="status">Tap START SCANNER</div>
  </header>

  <div id="scanner-container"></div>

  <div id="result">
    <div id="result-label">LAST BARCODE</div>
    <div id="barcodeValue">Waiting...</div>
  </div>

  <div id="buttons">
    <button id="startBtn">📷 START SCANNER</button>
    <button id="stopBtn">⏹ STOP SCANNER</button>
  </div>

  <div id="lastScans">
    <h2>Recent scans</h2>
    <div id="scanList"></div>
  </div>

  <script type="module">
    import { BarcodeScanner } from "https://esm.sh/web-wasm-barcode-reader@1.6.1";

    const container = document.getElementById("scanner-container");
    const statusEl = document.getElementById("status");
    const barcodeValue = document.getElementById("barcodeValue");
    const scanList = document.getElementById("scanList");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    let scanner = null;
    let lastBarcode = "";
    let lastScanTime = 0;
    const DUPLICATE_DELAY = 1500;

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    function addRecentScan(barcode, type) {
      const item = document.createElement("div");
      item.className = "scan-item";
      item.innerHTML =
        "<strong>" + barcode + "</strong><br>" +
        "<small>" + (type || "Barcode") + " • " +
        new Date().toLocaleTimeString() + "</small>";

      scanList.prepend(item);

      while (scanList.children.length > 10) {
        scanList.removeChild(scanList.lastChild);
      }
    }

    function beep() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        const audioContext = new AudioContext();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.frequency.value = 1200;
        oscillator.type = "sine";
        gain.gain.value = 0.08;

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.08);
      } catch (e) {}
    }

    async function startScanner() {
      if (scanner) return;

      try {
        setStatus("Starting iPhone barcode scanner...");

        scanner = new BarcodeScanner({
          container: container,

          // GitHub Pages location:
          // /kirana-scanner/public/a.out.js
          // /kirana-scanner/public/a.out.wasm
          wasmPath: new URL("./public/", import.meta.url).href,

          scanInterval: 150,

          onDetect: (result) => {
            const barcode = result.data;
            const type = result.symbol || "Barcode";
            const now = Date.now();

            if (!barcode) return;

            if (
              barcode === lastBarcode &&
              now - lastScanTime < DUPLICATE_DELAY
            ) {
              return;
            }

            lastBarcode = barcode;
            lastScanTime = now;

            barcodeValue.textContent = barcode;
            setStatus("✅ " + type + " detected", "success");
            addRecentScan(barcode, type);
            beep();
          }
        });

        await scanner.start();
        setStatus("Camera ready — point at a product barcode", "success");

      } catch (error) {
        console.error(error);
        scanner = null;
        setStatus("Scanner error: " + (error.message || error), "error");
      }
    }

    function stopScanner() {
      if (scanner) {
        scanner.stop();
        scanner = null;
      }

      container.innerHTML = "";
      setStatus("Scanner stopped");
    }

    startBtn.addEventListener("click", startScanner);
    stopBtn.addEventListener("click", stopScanner);

    window.addEventListener("pagehide", stopScanner);

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("This browser cannot access the camera.", "error");
    }
  </script>
</body>
</html>
